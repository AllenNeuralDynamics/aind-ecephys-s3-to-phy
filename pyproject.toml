[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aind-ecephys-s3-to-phy"
description = "Tools to get phy-ready data from AIND ecephys data on S3"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Allen Institute for Neural Dynamics" },
  { name = "Galen Lynch", email = "galen@galenlynch.com" },
]
classifiers = ["Programming Language :: Python :: 3"]
readme = "README.md"
version = "0.2.0"

dependencies = [
    "spikeinterface[full,streaming_extractors]",
    "tyro",
    "mtscomp",
    "wavpack-numcodecs",
    "s3fs",
]

[project.urls]
Repository = "https://github.com/AllenNeuralDynamics/aind-ecephys-s3-to-phy/"
Issues = "https://github.com/AllenNeuralDynamics/aind-ecephys-s3-to-phy/issues"
Changelog = "https://github.com/AllenNeuralDynamics/aind-ecephys-s3-to-phy/blob/main/CHANGELOG.md"

[project.scripts]
s3-to-phy = "aind_ecephys_s3_to_phy.cli:main"

[dependency-groups]
types = ["mypy"]
dev = [
    { include-group = "types" },
    "codespell",
    "pytest",
    "pytest-cov",
    "ruff",
    "interrogate",
]
jupyter = [{ include-group = "dev" }, "ipykernel", "pip"]

[tool.hatch.build.targets.wheel]
packages = ["src/aind_ecephys_s3_to_phy"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["scripts/"]

[tool.ruff.lint]
extend-select = ["Q", "RUF100", "C90", "I", "F", "E", "W", "D", "UP", "ANN", "PYI"]
extend-ignore = ["ANN401"]  # Skip self/cls type annotations
# Skip all type annotation checks in tests
per-file-ignores = { "tests/*.py" = ["ANN", "D"] }
mccabe = { max-complexity = 14 }
pydocstyle = { convention = "numpy" }

[tool.codespell]
skip = ".git,*.pdf,*.svg,./docs/build,uv.lock,mwe_workdir"

[tool.pytest.ini_options]
addopts = "--strict-markers --tb=short --cov=src --cov-report=term-missing --cov-fail-under=0 -m 'not integration'"
markers = ["integration: tests requiring S3 access (deselect with '-m \"not integration\"')"]
testpaths = ["tests"]

[tool.interrogate]
ignore-init-method = true
ignore-magic = true
ignore_module = true
fail-under = 30
exclude = [
  "__init__.py",
  "tests",
  "docs",
  "build",
  "examples",
  "scripts",
  "site",
]

[tool.commitizen]
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
major_version_zero = true

[tool.mypy]
files = ["src/aind_ecephys_s3_to_phy"]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["spikeinterface.*", "mtscomp", "wavpack_numcodecs", "s3fs", "tyro", "pandas"]
ignore_missing_imports = true

